# Cấu hình Workbench API. Mọi bí mật đọc từ biến môi trường — KHÔNG ghi giá trị thật vào file này.
# Khi dev: biến được nạp từ ../.env.local (file đó đã bị .gitignore chặn).
spring:
  application:
    name: workbench-api
  config:
    import:
      - optional:file:.env.local[.properties]
      - optional:file:../.env.local[.properties]
  threads:
    virtual:
      enabled: true
  # Thông điệp cho người dùng: messages.properties (vi, mặc định), messages_en, messages_de
  messages:
    basename: messages
    fallback-to-system-locale: false # ngôn ngữ lạ → tiếng Việt, không phụ thuộc locale của máy chủ
    always-use-message-format: true # mọi chuỗi cùng một quy tắc: nháy đơn viết ''
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5433/workbench}
    username: ${DATABASE_USER:workbench}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
        # Classpath có cả Jackson 2 (qua swagger-core) và Jackson 3 → chỉ định rõ Jackson 3 cho cột jsonb
        type:
          json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  flyway:
    locations: classpath:db/migration
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never # bảng SPRING_SESSION do Flyway tạo
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:chua-cau-hinh}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,email,profile
            # Giữ đường dẫn cũ → không phải sửa OAuth client trên Google Cloud
            redirect-uri: "${workbench.app-url}/api/auth/callback/{registrationId}"

server:
  port: ${API_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        name: WORKBENCH_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

workbench:
  app-url: ${APP_URL:http://localhost:3000}
  default-timezone: ${TZ:Asia/Ho_Chi_Minh}
  access:
    allowed-emails: ${ALLOWED_EMAILS:}
    allowed-domains: ${ALLOWED_DOMAINS:}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  jobs:
    enabled: true
    tick: 30s

logging:
  level:
    org.hibernate.orm.deprecation: error
