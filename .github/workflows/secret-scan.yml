name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  # SHA256 của gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz — đổi version thì cập nhật cả dòng này
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # quét toàn bộ lịch sử, không chỉ commit mới nhất

      - name: Cài gitleaks (kiểm tra SHA256)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      # Quét mọi commit trong lịch sử (không dùng gitleaks-action: nó lỗi ở lần push đầu tiên)
      - name: Gitleaks
        run: /tmp/gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
