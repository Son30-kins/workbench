# Tạo tag `v1.2.3` trên main → build image đa kiến trúc → quét → đẩy lên Docker Hub.
# Cần 2 secrets trong GitHub (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME — tên tài khoản Docker Hub
#   DOCKERHUB_TOKEN    — Personal Access Token (Read & Write), KHÔNG dùng mật khẩu
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: sonnld3007/managementtask

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto

      # 1. Build bản amd64 để quét trước khi phát hành
      - name: Build để quét
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: managementtask:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Quét bí mật — có là dừng
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: managementtask:scan
          scanners: secret
          exit-code: "1"

      - name: Quét lỗ hổng nghiêm trọng (đã có bản vá) — có là dừng
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: managementtask:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 2. Đạt → build đa kiến trúc và đẩy
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & đẩy lên Docker Hub
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Cập nhật trang giới thiệu trên Docker Hub
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4
        continue-on-error: true # token cần quyền admin repo; thiếu quyền thì bỏ qua, không làm hỏng bản phát hành
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
          short-description: "Quản lý công việc tự host: form mẫu tự sinh task, ưu tiên, nhắc việc qua Telegram"
