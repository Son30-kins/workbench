name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: workbench
          POSTGRES_DB: workbench
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://workbench@localhost:5432/workbench
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      # Giá trị giả chỉ dùng trong CI, sinh ngẫu nhiên mỗi lần chạy — không có bí mật thật nào
      - name: Cấu hình môi trường test
        run: |
          echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_ID=ci" >> "$GITHUB_ENV"
          echo "GOOGLE_CLIENT_SECRET=ci" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image (không đẩy)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: workbench:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Quét bí mật trong image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: workbench:ci
          scanners: secret
          exit-code: "1"
